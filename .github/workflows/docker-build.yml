name: Verify and publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: dovieuu/microbook-maker
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) throw Error('Tag must match package version')"
      - uses: actions/cache@v4
        with:
          path: .cache/public-books
          key: public-books-${{ hashFiles('tests/public-books.json') }}
      - name: Quick checks
        run: npm run mb -- check --out .artifacts/release-quick
      - name: Full corpus and browser checks
        run: npm run mb -- test --no-build --suite full --out .artifacts/release-full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: .artifacts/release-*

  build-image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: microbook-maker:release-candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,scope=runtime-${{ matrix.arch }},mode=max
      - name: Verify the runtime on native hardware
        run: node tools/verify-runtime.mjs microbook-maker:release-candidate ${{ matrix.arch }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push image by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: Record digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/microbook-digests
          touch "/tmp/microbook-digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: microbook-digest-${{ matrix.arch }}
          path: /tmp/microbook-digests/*
          if-no-files-found: error

  publish:
    needs: [verify, build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: actions/download-artifact@v4
        with:
          pattern: microbook-digest-*
          path: /tmp/microbook-digests
          merge-multiple: true
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Publish the multi-platform image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then tags+=(-t "$tag"); fi
          done <<< "$IMAGE_TAGS"
          sources=()
          for file in /tmp/microbook-digests/*; do
            digest="${file##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE_NAME@sha256:$digest")
          done
          [[ ${#tags[@]} -gt 0 && ${#sources[@]} -eq 2 ]]
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish notes and sample
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_flags+=(--prerelease); fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "MicroBook $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md "${release_flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" samples/flatland-microbook.pdf samples/flatland-settings.json --clobber
