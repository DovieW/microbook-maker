name: Verify and publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: dovieuu/microbook-maker
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) throw Error('Tag must match package version')"
      - uses: actions/cache@v4
        with:
          path: .cache/public-books
          key: public-books-${{ hashFiles('tests/public-books.json') }}
      - name: Quick checks
        run: npm run mb -- check --out .artifacts/release-quick
      - name: Full corpus and browser checks
        run: npm run mb -- test --no-build --suite full --out .artifacts/release-full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: .artifacts/release-*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish notes and sample
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_flags+=(--prerelease); fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "MicroBook $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md "${release_flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" samples/alice-microbook.pdf samples/alice-settings.json --clobber
