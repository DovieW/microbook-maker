services:
  microbook-maker:
    image: ${MICROBOOK_IMAGE:-microbook-maker:local}
    build:
      context: .
      target: runtime
    ports:
      - "7777:7777"
    volumes:
      - mbm-generated:/app/be/generated
      - mbm-uploads:/app/be/uploads
    init: true
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  mbm-generated:
  mbm-uploads:
